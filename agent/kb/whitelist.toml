# 知识库收哪些文件（docs/agent-plan.md 第 7.2 节）。手工维护，逐个写完整相对路径，不用通配符。
# authority：rule / status 默认检索；research 默认检索、superseded = true 的跳过；
#            record 只在 kb_search(scope="handoff") 时检索，不自动收新的交接记录。
# research 每条写 cited_in（文档#小节标题全文）、basis（path / dir / script）、generated_by、anchors（≥2 个
# 同时出现在小节和文件里的数字原文，− 与 - 视为同一字符）；锚点不够时写 anchors_waived = "理由"。
# generated_by 的脚本里不出现输出文件名时（命令行重定向生成），写 redirect = true。
# 核对：tests/test_agent_kb_sources.py；改完运行 python -m agent.kb --update。

